<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>おみくじ</title>

  <style>
    body {
      background-color: #eeeeee;
      text-align: center;
      font-family: sans-serif;
    }

    h1 {
      color: #4b0082;
      margin-top: 50px;
    }

    #result {
      font-size: 40px;
      font-weight: bold;
      color: #333333;
      margin: 30px;
    }

   button {
    padding: 10px 25px;
    font-size: 18px;
    background-color: #6a5acd;
    color: white;
    border: 1px solid #483d8b;
    border-radius: 5px;
  }

    button:hover {
      background-color: #ffdd88;
    }
  </style>
</head>

<body>

  <h1>おみくじ</h1>

  <p>今日の運勢を占ってみよう！ボタンを押してね！</p>

  <div id="result">？？？</div>

  <button onclick="drawOmikuji()">おみくじを引く</button>

  <script>
    function drawOmikuji() {
      var results = ["大吉", "中吉", "小吉", "吉", "凶"];

      var random = Math.floor(Math.random() * results.length);

      document.getElementById("result").textContent = results[random];
    }
  </script>

</body>
</html>
